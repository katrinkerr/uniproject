<div class="auth-page">
  <app-auth-aside
    heading="З поверненням!"
    text="Твої місії вже чекають на тебе. Час повертатися до гри."
  />

  <main class="auth-panel">
    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <h1 class="auth-form__title">Увійти в акаунт</h1>

      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="example@mail.com"
          autocomplete="email"
          [class.field__input--invalid]="isInvalid(form.controls.email)"
        />
        @if (isInvalid(form.controls.email)) {
          <small class="field__error">Введи коректний email</small>
        }
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
          [class.field__input--invalid]="isInvalid(form.controls.password)"
        />
        @if (isInvalid(form.controls.password)) {
          <small class="field__error">Пароль має містити щонайменше 8 символів</small>
        }
      </div>

      @if (errorMessage(); as message) {
        <p class="auth-form__error" role="alert">{{ message }}</p>
      }

      <button class="auth-button" type="submit" [disabled]="isLoading()">
        {{ isLoading() ? 'Вхід...' : 'Увійти' }}
      </button>

      <p class="auth-form__footer">
        Ще немає акаунту? <a routerLink="/register">Зареєструватися</a>
      </p>
    </form>
  </main>
</div>
