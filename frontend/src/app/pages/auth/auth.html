<main class="auth-page">
  <section class="auth-card">
    <a class="brand" routerLink="/" aria-label="">
      <span class="brand-mark"></span>
      <span>Plot.<span class="brand-light"></span></span>
    </a>
    <p class="eyebrow">РАДІ ЗНОВУ БАЧИТИ</p>
    <h1>Увійди до PlotGenerator</h1>
    <p class="intro">Продовжуй планувати навчання в одному зручному місці.</p>
    <form>
      <label for="login-email">Електронна пошта</label>
      <input id="login-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" />
      <label for="login-password">Пароль</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Введи пароль" />
      <button type="button" class="submit-button" disabled>Увійти</button>
      <p class="form-note">Вхід стане доступним після підключення сервера.</p>
    </form>
    <p class="switch-page">Ще не маєш акаунта? <a routerLink="/register">Зареєструватися</a></p>
    <a class="back-link" routerLink="/">← Повернутися на сторінку ознайомлення</a>
  </section>
</main>
